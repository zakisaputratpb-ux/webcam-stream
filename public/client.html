<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Stream - Client</title>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin: 20px 0 10px; font-size: 24px; }
        #status {
            margin-bottom: 15px;
            padding: 8px 16px;
            background: #1a1a1a;
            border-radius: 9999px;
            font-size: 14px;
        }
        #stream {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .error {
            color: #f87171;
            background: #3a1f1f;
            padding: 12px 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>📹 Live Stream from Phone</h1>
    <div id="status">Connecting to server...</div>
    
    <img id="stream" src="" alt="Live Stream" style="display: none;">
    
    <div id="error" class="error" style="display: none;"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const streamEl = document.getElementById('stream');
        const errorEl = document.getElementById('error');

        // Connect to Socket.IO server
        const socket = io();

        socket.on('connect', () => {
            statusEl.innerHTML = '✅ Connected • Waiting for stream from phone...';
            console.log('[Client] Connected to server');
        });

        socket.on('connect_error', () => {
            statusEl.innerHTML = '❌ Connection failed';
            errorEl.innerHTML = 'Cannot connect to server. Please refresh.';
            errorEl.style.display = 'block';
        });

        // Listen for frames from Android app
        socket.on('frame', (data) => {
            if (data.image) {
                // Update image source with base64 from phone
                streamEl.src = 'data:image/jpeg;base64,' + data.image;
                streamEl.style.display = 'block';
                statusEl.innerHTML = '📡 Streaming live from phone';
            }
        });

        // Optional: show when phone disconnects
        socket.on('disconnect', () => {
            statusEl.innerHTML = '⚠ Phone disconnected';
        });

        console.log('%c[Client] Ready. Waiting for frames from Android...', 'color:#666');
    </script>

        streamEl.src = 'data:image/jpeg;base64,' + data.image;
        streamEl.style.display = 'block';
        statusEl.innerHTML = '📡 Streaming live from phone';
    }
});
</body>
</html>
