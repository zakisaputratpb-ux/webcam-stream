<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Client</title>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container { padding: 20px; max-width: 320px; }
        h1 { font-size: 28px; margin-bottom: 8px; }
        .status { margin: 20px 0; font-size: 15px; color: #aaa; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 17px;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled { background: #555; }
        .error {
            background: #3a1f1f;
            color: #f87171;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 60px; margin-bottom: 16px;">📹</div>
        <h1>Webcam Client</h1>
        <div id="status" class="status">Ready to stream</div>
        
        <button id="start-btn" onclick="startStreaming()">Start Streaming</button>
        
        <div id="error-box" class="error" style="display: none;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        let localStream = null;
        let peerConnection = null;
        let roomId = 'demo';

        // Get room from URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) roomId = urlParams.get('room');

        function updateStatus(text, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = isError ? 
                `<span style="color:#f87171">⚠ ${text}</span>` : text;
        }

        function showError(msg) {
            const errorBox = document.getElementById('error-box');
            errorBox.innerHTML = msg;
            errorBox.style.display = 'block';
            setTimeout(() => errorBox.style.display = 'none', 6000);
        }

        async function startStreaming() {
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = 'Requesting camera...';

            try {
                // 1. Get camera access first
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });

                // 2. Connect to signaling server
                socket = io();

                socket.on('connect', () => {
                    console.log('Connected to server');
                    socket.emit('join-room', { roomId, role: 'client' });
                    updateStatus('Streaming active • Camera connected');
                    btn.style.display = 'none';
                });

                socket.on('connect_error', () => {
                    showError('Connection failed. Please refresh the page.');
                    btn.disabled = false;
                    btn.textContent = 'Try Again';
                });

                // 3. Create WebRTC connection
                const config = {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                };

                peerConnection = new RTCPeerConnection(config);

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && socket) {
                        socket.emit('ice-candidate', { roomId, candidate: event.candidate });
                    }
                };

                socket.on('answer', async (data) => {
                    if (peerConnection) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    }
                });

                socket.on('ice-candidate', async (data) => {
                    if (peerConnection && data.candidate) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                });

                // Create and send offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { roomId, offer });

            } catch (err) {
                console.error(err);
                let msg = 'Failed to access camera. ';
                if (err.name === 'NotAllowedError') {
                    msg += 'Please allow camera permission in your browser settings.';
                } else if (err.name === 'NotFoundError') {
                    msg += 'No camera found on this device.';
                } else {
                    msg += err.message;
                }
                showError(msg);
                btn.disabled = false;
                btn.textContent = 'Try Again';
                updateStatus('Camera access denied', true);
            }
        }

        // Auto-connect socket when page loads (for faster start)
        window.onload = () => {
            console.log('%c[Client] Page loaded. Click button to start.', 'color:#666');
        };
    </script>
</body>
</html>
