<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Stream - Choose Mode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 40px;
        }
        h1 { font-size: 32px; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 40px; }
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: 600;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-client {
            background: #3b82f6;
            color: white;
        }
        .btn-host {
            background: #22c55e;
            color: white;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .info {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Webcam Stream</h1>
        <p class="subtitle">Choose how you want to use it</p>
        
        <a href="/client" class="btn btn-client">📹 Open Client (Webcam)</a>
        <a href="/host" class="btn btn-host">🖥️ Open Host (View + OBS)</a>
        
        <div class="info">
            Use the same link on your phone and computer.<br>
            Works from anywhere with ngrok.
        </div>
    </div>
</body>
</html>
