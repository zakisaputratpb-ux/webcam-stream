<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host View - Webcam Stream</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: system-ui; margin: 0; padding: 0; }
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #111; }
        h1 { margin: 0; font-size: 20px; }
        #status { padding: 8px 16px; background: #1a1a1a; border-radius: 9999px; font-size: 14px; display: inline-block; }
        #stream { max-width: 100%; max-height: 85vh; display: block; margin: 20px auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>📹 Host View</h1>
            <div id="status" class="status">Waiting for phone...</div>
        </div>
    </div>

    <img id="stream" src="" alt="Live Stream" style="display: none;">

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const streamEl = document.getElementById('stream');

        const socket = io();

        socket.on('connect', () => {
            statusEl.innerHTML = '✅ Connected • Waiting for phone stream...';
        });

        socket.on('frame', (data) => {
            if (data.image) {
                streamEl.src = 'data:image/jpeg;base64,' + data.image;
                streamEl.style.display = 'block';
                statusEl.innerHTML = '📡 Live from phone';
            }
        });

        socket.on('disconnect', () => {
            statusEl.innerHTML = '⚠ Phone disconnected';
        });
    </script>
</body>
</html>
