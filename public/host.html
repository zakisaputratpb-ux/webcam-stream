<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host View • Webcam Stream</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --primary: #3b82f6;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: #fff;
            font-family: 'Inter', system_ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #111;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            z-index: 10;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo svg {
            width: 20px;
            height: 20px;
            color: white;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        
        .status-pill {
            background: #1a1a1a;
            padding: 4px 14px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }
        
        #remote-video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 0;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.6);
        }
        
        .overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
        }
        
        .no-signal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #555;
        }
        
        .no-signal svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        
        .no-signal h3 {
            margin: 0 0 8px;
            font-weight: 500;
            color: #666;
        }
        
        .no-signal p {
            margin: 0;
            font-size: 14px;
            color: #555;
        }
        
        .footer {
            background: #111;
            padding: 12px 24px;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
        }
        
        .controls {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            background: #222;
            color: #ddd;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #333;
            color: #fff;
        }
        
        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        
        .error-toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #3a1f1f;
            color: #f87171;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            z-index: 1000;
            display: none;
        }
        
        .room-info {
            font-family: monospace;
            background: #1a1a1a;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            </div>
            <div>
                <div class="title">Host View</div>
                <div style="font-size:12px; color:#666;">Client Webcam Feed</div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-pill">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-text">Waiting for client...</span>
            </div>
            <div style="font-size:12px; color:#555;">
                Room: <span class="room-info" id="room-id">demo</span>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <video id="remote-video" autoplay playsinline></video>
        
        <div id="no-signal" class="no-signal">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <h3>No signal yet</h3>
            <p>Open the client page and start streaming</p>
        </div>
    </div>
    
    <div class="footer">
        <div>
            <span style="color:#444">For OBS Studio:</span> 
            <strong>Add Browser Source → Point to this page URL</strong>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button class="btn btn-primary" onclick="copyUrl()">Copy URL</button>
        </div>
    </div>
    
    <div id="error-toast" class="error-toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let peerConnection = null;
        let roomId = 'demo';
        
        // Get room from URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            roomId = urlParams.get('room');
        }
        document.getElementById('room-id').textContent = roomId;
        
        const video = document.getElementById('remote-video');
        const noSignal = document.getElementById('no-signal');
        const connText = document.getElementById('connection-text');
        const connDot = document.getElementById('connection-dot');
        
        function updateConnection(status, color = '#22c55e') {
            connText.textContent = status;
            connDot.style.background = color;
            
            if (status.includes('Connected')) {
                noSignal.style.display = 'none';
                video.style.display = 'block';
            }
        }
        
        function showError(msg) {
            const toast = document.getElementById('error-toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }
        
        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                console.log('Host connected to signaling server');
                socket.emit('join-room', { roomId, role: 'host' });
                updateConnection('Connected to server', '#22c55e');
            });
            
            socket.on('disconnect', () => {
                updateConnection('Server disconnected', '#ef4444');
            });
            
            socket.on('user-joined', (data) => {
                if (data.role === 'client') {
                    console.log('Client joined the room');
                    updateConnection('Client connected', '#22c55e');
                }
            });
            
            socket.on('ready-to-connect', () => {
                console.log('Client is ready');
            });
            
            socket.on('offer', async (data) => {
                console.log('Received offer from client');
                updateConnection('Receiving stream...', '#eab308');
                
                if (!peerConnection) {
                    createPeerConnection();
                }
                
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    socket.emit('answer', { 
                        roomId, 
                        answer: peerConnection.localDescription 
                    });
                    
                    console.log('Answer sent to client');
                } catch (e) {
                    console.error('Error handling offer:', e);
                    showError('Failed to process incoming stream');
                }
            });
            
            socket.on('ice-candidate', async (data) => {
                if (peerConnection && data.candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    } catch (e) {
                        console.error('Error adding ICE candidate:', e);
                    }
                }
            });
            
            socket.on('user-left', (data) => {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                video.srcObject = null;
                noSignal.style.display = 'block';
                updateConnection('Client disconnected', '#ef4444');
            });
        }
        
        function createPeerConnection() {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };
            
            peerConnection = new RTCPeerConnection(config);
            
            peerConnection.ontrack = (event) => {
                console.log('Received remote track');
                if (video.srcObject !== event.streams[0]) {
                    video.srcObject = event.streams[0];
                    updateConnection('Streaming live from client', '#22c55e');
                    
                    // Auto-play fix for some browsers
                    video.play().catch(e => console.log('Autoplay prevented:', e));
                }
            };
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { 
                        roomId, 
                        candidate: event.candidate 
                    });
                }
            };
            
            peerConnection.onconnectionstatechange = () => {
                console.log('Host connection state:', peerConnection.connectionState);
                
                if (peerConnection.connectionState === 'connected') {
                    updateConnection('Live • WebRTC connected', '#22c55e');
                } else if (peerConnection.connectionState === 'disconnected' || 
                           peerConnection.connectionState === 'failed') {
                    updateConnection('Connection lost', '#ef4444');
                    showError('Stream connection lost. Client may have stopped.');
                }
            };
            
            peerConnection.oniceconnectionstatechange = () => {
                console.log('ICE state:', peerConnection.iceConnectionState);
            };
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showError('Fullscreen not supported or blocked');
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        function copyUrl() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                const btns = document.querySelectorAll('.btn');
                const originalText = btns[1].textContent;
                btns[1].textContent = '✓ Copied!';
                setTimeout(() => {
                    btns[1].textContent = originalText;
                }, 2000);
            }).catch(() => {
                // Fallback
                prompt('Copy this URL for OBS Browser Source:', url);
            });
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });
        
        // Make video clickable for fullscreen
        video.addEventListener('click', toggleFullscreen);
        
        // Initialize
        function init() {
            initSocket();
            
            // Show initial state
            video.style.display = 'none';
            noSignal.style.display = 'block';
            
            console.log('%c[Host] Ready. Open client page and start streaming to see feed here.', 'color:#666');
            console.log('%c[Host] For OBS: Add "Browser Source" and paste this page URL', 'color:#3b82f6');
            
            // Auto-reconnect hint
            setTimeout(() => {
                if (!peerConnection || peerConnection.connectionState !== 'connected') {
                    console.log('%c[Host] Tip: Make sure client has started streaming', 'color:#666');
                }
            }, 8000);
        }
        
        window.onload = init;
        
        // Keep page awake (for OBS long running)
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    </script>
</body>
</html>
